<text x="500" y="464" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">橙色 = k 这一行和这一列；绿色 = 这一轮正在被更新的格子</text>
<rect x="24" y="424" width="460" height="0" rx="8" fill="#fff" stroke="#fff" stroke-width="0"/>
<text x="24" y="430" font-size="14.5" fill="#1e3a8a" text-anchor="start" font-weight="700">转移：</text>
<text x="72" y="430" font-size="14" fill="#1e3a8a" font-family="'DejaVu Sans Mono',monospace" text-anchor="start" font-weight="700">f[i][j] = min(f[i][j], f[i][k] + f[k][j])</text>
<text x="24" y="454" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">降维成二维后，k 依然要在最外层 —— 想想背包的滚动数组。</text>
