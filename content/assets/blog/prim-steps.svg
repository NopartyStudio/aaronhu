<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360">
  <style>
    .edge { stroke: #cbd5e1; stroke-width: 2; fill: none; }
    .tree { stroke: #16a34a; stroke-width: 4; fill: none; }
    .node { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
    .node.on { fill: #22c55e; stroke: #15803d; }
    .nid { font: bold 13px 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #0f172a; text-anchor: middle; }
    .w { font: bold 12px 'DejaVu Sans', sans-serif; fill: #475569; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4; }
    .d { font: 12px 'DejaVu Sans', sans-serif; fill: #2563eb; text-anchor: middle; }
    .title { font: bold 15px 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #0f172a; }
    .note { font: 13px 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #475569; }
  </style>

  <rect width="1080" height="360" fill="#ffffff"/>

  <text class="title" x="20" y="28">① 初始：只有点 1</text>
  <text class="title" x="380" y="28">② 加入 1-3、3-2</text>
  <text class="title" x="740" y="28">③ 完成：1+1+2+3 = 7</text>

  <!-- ================= Panel 1 ================= -->
  <g transform="translate(20,50)">
    <line class="edge" x1="60" y1="150" x2="170" y2="60"/>
    <line class="edge" x1="60" y1="150" x2="170" y2="150"/>
    <line class="edge" x1="60" y1="150" x2="120" y2="250"/>
    <line class="edge" x1="170" y1="60" x2="170" y2="150"/>
    <line class="edge" x1="170" y1="60" x2="300" y2="120"/>
    <line class="edge" x1="170" y1="150" x2="300" y2="120"/>
    <line class="edge" x1="120" y1="250" x2="300" y2="120"/>

    <text class="w" x="110" y="95">2</text>
    <text class="w" x="112" y="140">1</text>
    <text class="w" x="78" y="210">2</text>
    <text class="w" x="182" y="105">1</text>
    <text class="w" x="245" y="80">3</text>
    <text class="w" x="247" y="150">6</text>
    <text class="w" x="218" y="195">3</text>

    <circle class="node on" cx="60" cy="150" r="16"/><text class="nid" x="60" y="155">1</text>
    <circle class="node" cx="170" cy="60" r="16"/><text class="nid" x="170" y="65">2</text>
    <circle class="node" cx="170" cy="150" r="16"/><text class="nid" x="170" y="155">3</text>
    <circle class="node" cx="120" cy="250" r="16"/><text class="nid" x="120" y="255">4</text>
    <circle class="node" cx="300" cy="120" r="16"/><text class="nid" x="300" y="125">5</text>

    <text class="d" x="30" y="190">d=0</text>
    <text class="d" x="205" y="45">∞</text>
    <text class="d" x="215" y="180">∞</text>
    <text class="d" x="70" y="285">∞</text>
    <text class="d" x="300" y="160">∞</text>
  </g>

  <!-- ================= Panel 2 ================= -->
  <g transform="translate(380,50)">
    <line class="edge" x1="60" y1="150" x2="170" y2="60"/>
    <line class="tree" x1="60" y1="150" x2="170" y2="150"/>
    <line class="edge" x1="60" y1="150" x2="120" y2="250"/>
    <line class="tree" x1="170" y1="60" x2="170" y2="150"/>
    <line class="edge" x1="170" y1="60" x2="300" y2="120"/>
    <line class="edge" x1="170" y1="150" x2="300" y2="120"/>
    <line class="edge" x1="120" y1="250" x2="300" y2="120"/>

    <text class="w" x="110" y="95">2</text>
    <text class="w" x="112" y="140">1</text>
    <text class="w" x="78" y="210">2</text>
    <text class="w" x="182" y="105">1</text>
    <text class="w" x="245" y="80">3</text>
    <text class="w" x="247" y="150">6</text>
    <text class="w" x="218" y="195">3</text>

    <circle class="node on" cx="60" cy="150" r="16"/><text class="nid" x="60" y="155">1</text>
    <circle class="node on" cx="170" cy="60" r="16"/><text class="nid" x="170" y="65">2</text>
    <circle class="node on" cx="170" cy="150" r="16"/><text class="nid" x="170" y="155">3</text>
    <circle class="node" cx="120" cy="250" r="16"/><text class="nid" x="120" y="255">4</text>
    <circle class="node" cx="300" cy="120" r="16"/><text class="nid" x="300" y="125">5</text>

    <text class="d" x="28" y="190">d=0</text>
    <text class="d" x="205" y="45">d=1</text>
    <text class="d" x="215" y="180">d=1</text>
    <text class="d" x="70" y="285">d=2</text>
    <text class="d" x="300" y="160">d=3</text>
  </g>

  <!-- ================= Panel 3 ================= -->
  <g transform="translate(740,50)">
    <line class="tree" x1="60" y1="150" x2="170" y2="60"/>
    <line class="tree" x1="60" y1="150" x2="170" y2="150"/>
    <line class="tree" x1="60" y1="150" x2="120" y2="250"/>
    <line class="tree" x1="170" y1="60" x2="170" y2="150"/>
    <line class="tree" x1="170" y1="60" x2="300" y2="120"/>
    <line class="edge" x1="170" y1="150" x2="300" y2="120"/>
    <line class="edge" x1="120" y1="250" x2="300" y2="120"/>

    <text class="w" x="110" y="95">2</text>
    <text class="w" x="112" y="140">1</text>
    <text class="w" x="78" y="210">2</text>
    <text class="w" x="182" y="105">1</text>
    <text class="w" x="245" y="80">3</text>
    <text class="w" x="247" y="150">6</text>
    <text class="w" x="218" y="195">3</text>

    <circle class="node on" cx="60" cy="150" r="16"/><text class="nid" x="60" y="155">1</text>
    <circle class="node on" cx="170" cy="60" r="16"/><text class="nid" x="170" y="65">2</text>
    <circle class="node on" cx="170" cy="150" r="16"/><text class="nid" x="170" y="155">3</text>
    <circle class="node on" cx="120" cy="250" r="16"/><text class="nid" x="120" y="255">4</text>
    <circle class="node on" cx="300" cy="120" r="16"/><text class="nid" x="300" y="125">5</text>

    <text class="note" x="10" y="300">绿边 = 选入 MST；灰边 = 未选</text>
  </g>
</svg>
