<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif">
  <style>
    .e{stroke:#94a3b8;stroke-width:2.4;fill:none;stroke-linecap:round}
    .e2{stroke:#cbd5e1;stroke-width:2.2;fill:none;stroke-linecap:round}
    .hl{stroke:#2563eb;stroke-width:4.4;stroke-linecap:round;fill:none}
    .bad{stroke:#dc2626;stroke-width:4.4;stroke-linecap:round;fill:none}
    .good{stroke:#16a34a;stroke-width:4.4;stroke-linecap:round;fill:none}
    .dash{stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:7 6;fill:none}
    .n{fill:#f8fafc;stroke:#64748b;stroke-width:2.4}
    .ns{fill:#dcfce7;stroke:#16a34a;stroke-width:2.8}
    .ncur{fill:#fef3c7;stroke:#f59e0b;stroke-width:3.4}
    .w{font-size:13px;font-weight:700;fill:#475569;text-anchor:middle}
</style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1080" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="21" fill="#0f172a" text-anchor="start" font-weight="700">⑧ SPFA：只把“刚被改小的点”丢进队列</text>
<text x="24" y="58" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400">BF 每轮把所有边都扫一遍，很浪费；SPFA 只从“变过的点”继续往外扩</text>
<rect x="24" y="76" width="420" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="40" y="102" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700">还是那个负权图</text>
<text x="40" y="122" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">边：1→2(1)  1→3(3)  2→4(1)  3→4(−3)  4→5(1)</text>
<line class="e" x1="83.708884929547" y1="233.9468177183322" x2="176.291115070453" y2="166.0531822816678"/>
<rect x="122.4" y="182.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="130.0" y="194.0" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<line class="e" x1="83.92694264882368" y1="253.74885985417657" x2="176.07305735117632" y2="318.2511401458234"/>
<rect x="138.4" y="268.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="146.0" y="280.0" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">3</text>
<line class="e" x1="204.2785833644416" y1="165.22616155856227" x2="305.7214166355584" y2="230.77383844143773"/>
<rect x="247.4" y="180.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="255.0" y="192.0" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<line class="e" x1="204.07786102631093" y1="318.47037099757415" x2="305.9221389736891" y2="249.52962900242585"/>
<rect x="243.8" y="266.5" width="22.5" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="255.0" y="278.0" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">−3</text>
<line class="e" x1="337.0" y1="240.0" x2="383.0" y2="240.0"/>
<rect x="352.4" y="222.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="360.0" y="234.0" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<circle class="ns" cx="70" cy="244" r="17"/><text x="70" y="249.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">1</text>
<circle class="n" cx="190" cy="156" r="17"/><text x="190" y="161.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">2</text>
<circle class="n" cx="190" cy="328" r="17"/><text x="190" y="333.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">3</text>
<circle class="n" cx="320" cy="240" r="17"/><text x="320" y="245.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">4</text>
<circle class="n" cx="400" cy="240" r="17"/><text x="400" y="245.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">5</text>
<text x="44" y="364" font-size="12.5" fill="#15803d" text-anchor="start" font-weight="700">SPFA 会算出 d[4] = 0，Dijkstra 不会</text>
<text x="470" y="100" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">队列的变化（方框 = 队列里的点）</text>
<text x="470" y="133" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">① 起点入队</text>
<rect x="700" y="116" width="30" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="715" y="134" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="700">1</text>
<text x="770" y="133" font-size="12" fill="#334155" text-anchor="start" font-weight="400">d = [0, ∞, ∞, ∞, ∞]</text>
<text x="770" y="153" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="700">q.push(1)</text>
<text x="470" y="179" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">② 弹出 1，松弛它的出边</text>
<rect x="700" y="162" width="30" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="715" y="180" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="700">2</text>
<rect x="734" y="162" width="30" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="749" y="180" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="700">3</text>
<text x="770" y="179" font-size="12" fill="#334155" text-anchor="start" font-weight="400">d2=1，d3=3 → 都变小，入队</text>
<text x="770" y="199" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="700">d=[0,1,3,∞,∞]</text>
<text x="470" y="225" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">③ 弹出 2，松弛 2→4</text>
<rect x="700" y="208" width="30" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="715" y="226" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="700">3</text>
<rect x="734" y="208" width="30" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="749" y="226" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="700">4</text>
<text x="770" y="225" font-size="12" fill="#334155" text-anchor="start" font-weight="400">d4 = 1+1 = 2</text>
<text x="770" y="245" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="700">d=[0,1,3,2,∞]</text>
<text x="470" y="271" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">④ 弹出 3，松弛 3→4（负权）</text>
<rect x="700" y="254" width="30" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="715" y="272" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="700">4</text>
<text x="770" y="271" font-size="12" fill="#334155" text-anchor="start" font-weight="400">d4 = 3−3 = 0 &lt; 2！再改小</text>
<text x="770" y="291" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="700">d=[0,1,3,0,∞]</text>
<text x="470" y="317" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">⑤ 弹出 4，松弛 4→5</text>
<rect x="700" y="300" width="30" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="715" y="318" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="700">5</text>
<text x="770" y="317" font-size="12" fill="#334155" text-anchor="start" font-weight="400">d5 = 0+1 = 1</text>
<text x="770" y="337" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="700">d=[0,1,3,0,1]</text>
<text x="470" y="363" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">⑥ 队列空，收工</text>
<text x="700" y="363" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">（空）</text>
<text x="770" y="363" font-size="12" fill="#334155" text-anchor="start" font-weight="400">每个点都稳定了</text>
<text x="770" y="383" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="700">答案：0 1 3 0 1</text>
<rect x="24" y="396" width="1032" height="104" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="44" y="424" font-size="14.5" fill="#1e40af" text-anchor="start" font-weight="700">三个细节，写代码时最容易漏</text>
<text x="44" y="450" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="400">① inq[x]：x 已经在队列里就别再 push，否则队列里同一个点会堆一大堆。</text>
<text x="44" y="472" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="400">② 出队时先置 inq[x] = false，再松弛；否则这个点以后再也进不来了。</text>
<text x="44" y="494" font-size="13" fill="#9a3412" text-anchor="start" font-weight="400">③ 每个点可能被反复更新，所以最坏复杂度仍是 O(nm) —— 出题人可以故意卡 SPFA。</text>
</svg>
