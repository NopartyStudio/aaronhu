<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif">
  <style>
    .e{stroke:#94a3b8;stroke-width:2.4;fill:none;stroke-linecap:round}
    .e2{stroke:#cbd5e1;stroke-width:2.2;fill:none;stroke-linecap:round}
    .hl{stroke:#2563eb;stroke-width:4.4;stroke-linecap:round;fill:none}
    .bad{stroke:#dc2626;stroke-width:4.4;stroke-linecap:round;fill:none}
    .good{stroke:#16a34a;stroke-width:4.4;stroke-linecap:round;fill:none}
    .dash{stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:7 6;fill:none}
    .n{fill:#f8fafc;stroke:#64748b;stroke-width:2.4}
    .ns{fill:#dcfce7;stroke:#16a34a;stroke-width:2.8}
    .ncur{fill:#fef3c7;stroke:#f59e0b;stroke-width:3.4}
    .w{font-size:13px;font-weight:700;fill:#475569;text-anchor:middle}
</style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="980" height="460" fill="#ffffff"/>
<text x="24" y="34" font-size="21" fill="#0f172a" text-anchor="start" font-weight="700">⑨ 负环：一直绕圈一直变小，最短路根本不存在</text>
<text x="24" y="58" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400">一圈的总权值是 −3 &lt; 0，每绕一圈距离就再少 3，永远没有最小</text>
<rect x="24" y="76" width="420" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="40" y="102" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700">一个负环</text>
<text x="40" y="122" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">1→2(1)，2→3(−5)，3→1(1)</text>
<line class="e" x1="162.2090418491952" y1="165.22646200329478" x2="257.79095815080484" y2="268.7735379967052" marker-end="url(#ar)"/>
<rect x="216.2" y="199.0" width="15.5" height="16.6" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="224.0" y="211.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<line class="bad" x1="252.0" y1="282.0" x2="84.0" y2="282.0" marker-end="url(#ar)"/>
<rect x="156.5" y="280.0" width="23.1" height="16.6" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="168.0" y="292.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">−5</text>
<line class="e" x1="75.76887694436003" y1="266.88149996706187" x2="140.23112305563996" y2="167.11850003293816" marker-end="url(#ar)"/>
<rect x="100.2" y="199.0" width="15.5" height="16.6" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="108.0" y="211.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<circle class="n" cx="150" cy="152" r="18"/><text x="150" y="157.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">1</text>
<circle class="n" cx="270" cy="282" r="18"/><text x="270" y="287.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">2</text>
<circle class="n" cx="66" cy="282" r="18"/><text x="66" y="287.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">3</text>
<text x="210" y="344" font-size="13.5" fill="#b91c1c" text-anchor="middle" font-weight="700">绕一圈：1 − 5 + 1 = −3 ＜ 0</text>
<text x="480" y="100" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">从 1 出发绕圈，d[] 会怎样</text>
<text x="570" y="126" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">d[1]</text>
<text x="640" y="126" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">d[2]</text>
<text x="710" y="126" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">d[3]</text>
<text x="480" y="158" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">出发</text>
<rect x="546" y="138" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="577" y="157" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">0</text>
<rect x="616" y="138" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="647" y="157" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">∞</text>
<rect x="686" y="138" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="717" y="157" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">∞</text>
<text x="480" y="196" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">绕 1 圈</text>
<rect x="546" y="176" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="577" y="195" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−3</text>
<rect x="616" y="176" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="647" y="195" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">1</text>
<rect x="686" y="176" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="717" y="195" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−4</text>
<text x="480" y="234" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">绕 2 圈</text>
<rect x="546" y="214" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="577" y="233" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−6</text>
<rect x="616" y="214" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="647" y="233" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−2</text>
<rect x="686" y="214" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="717" y="233" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−7</text>
<text x="480" y="272" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">绕 3 圈</text>
<rect x="546" y="252" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="577" y="271" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−9</text>
<rect x="616" y="252" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="647" y="271" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−5</text>
<rect x="686" y="252" width="62" height="28" rx="5" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
<text x="717" y="271" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−10</text>
<text x="480" y="310" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">绕 k 圈</text>
<rect x="546" y="290" width="62" height="28" rx="5" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="577" y="309" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−3k</text>
<rect x="616" y="290" width="62" height="28" rx="5" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="647" y="309" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">1−3k</text>
<rect x="686" y="290" width="62" height="28" rx="5" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="717" y="309" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">−4−3k</text>
<text x="480" y="344" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="700">→ 永远在变小，没有“最小值”，这就是负环</text>
<rect x="24" y="386" width="930" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
<text x="44" y="412" font-size="13.5" fill="#1e40af" text-anchor="start" font-weight="700">程序里怎么发现？</text>
<text x="160" y="412" font-size="12.8" fill="#1e3a8a" text-anchor="start" font-weight="400">cnt[x] 记“到 x 的最短路用了几条边”，每次更新时 cnt[v] = cnt[u] + 1。</text>
<text x="160" y="434" font-size="12.8" fill="#1e3a8a" text-anchor="start" font-weight="400">若 cnt[x] ≥ n：n 个点的路径上必有重复点（抽屉原理）→ 路径里有环，而且是负环。</text>
</svg>
