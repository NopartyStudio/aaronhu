<text x="40" y="404" font-size="12" fill="#16a34a" text-anchor="start" font-weight="700">涂绿 = 已经定案，永远不会再改</text>
<text x="478" y="100" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">小根堆里存的是 (距离, 点号)</text>
<text x="478" y="122" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">堆顶永远是“离起点最近的候选点”</text>
<text x="478" y="144" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">① 现在的堆</text>
<rect x="478" y="152" width="232" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text x="594.0" y="172" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">(5, 2)</text>
<text x="722" y="172" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">← 堆顶</text>
<rect x="478" y="186" width="232" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="594.0" y="206" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">(6, 3)</text>
<rect x="478" y="220" width="232" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="594.0" y="240" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">(11, 4)</text>
<text x="478" y="272" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">▶ 弹出 (5,2)：把 2 定案</text>
<text x="478" y="298" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">② 用 2 松弛邻居后的堆</text>
<rect x="478" y="306" width="232" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text x="594.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">(6, 3)</text>
<text x="722" y="326" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">← 堆顶</text>
<rect x="478" y="340" width="232" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="594.0" y="360" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">(11, 4)</text>
<rect x="478" y="374" width="232" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="594.0" y="394" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">(9, 5)</text>
<text x="478" y="426" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">▶ 5 的距离从 ∞ 变成 9，于是 push 一个 (9,5)</text>
<rect x="800" y="136" width="244" height="176" rx="10" fill="#fff1f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="816" y="164" font-size="13.5" fill="#991b1b" text-anchor="start" font-weight="700">旧记录为什么不用删？</text>
<text x="816" y="190" font-size="11.5" fill="#7f1d1d" text-anchor="start" font-weight="400">堆没法“改”一个元素，</text>
<text x="816" y="207" font-size="11.5" fill="#7f1d1d" text-anchor="start" font-weight="400">只能再 push 一个新值。</text>
<text x="816" y="224" font-size="11.5" fill="#7f1d1d" text-anchor="start" font-weight="400">所以同一节点可能同时有</text>
<text x="816" y="241" font-size="11.5" fill="#7f1d1d" text-anchor="start" font-weight="400">(17,6) 和 (16,6) 两条记录。</text>
<text x="816" y="258" font-size="11.5" fill="#7f1d1d" text-anchor="start" font-weight="400">小的先出队；出队时查 vis[]，</text>
<text x="816" y="275" font-size="11.5" fill="#7f1d1d" text-anchor="start" font-weight="400">if (vis[u]) continue;</text>
<text x="816" y="292" font-size="11.5" fill="#7f1d1d" text-anchor="start" font-weight="400">旧记录就自动被丢掉了。</text>
</svg>
