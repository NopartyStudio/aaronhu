<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="840" viewBox="0 0 1080 840">
  <style>
    .edge { stroke: #cbd5e1; stroke-width: 2.5; fill: none; }
    .tree { stroke: #16a34a; stroke-width: 5; fill: none; }
    .node { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2.5; }
    .node.on { fill: #22c55e; stroke: #15803d; }
    .node.now { fill: #22c55e; stroke: #f59e0b; stroke-width: 5; }
    .nid { font: bold 19px 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #0f172a; text-anchor: middle; }
    .w { font: bold 18px 'DejaVu Sans', sans-serif; fill: #475569; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5; }
    .d { font: bold 16px 'DejaVu Sans', sans-serif; fill: #2563eb; text-anchor: middle; }
    .title { font: bold 21px 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #0f172a; }
    .cap { font: bold 16.5px 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #0f172a; }
    .cap2 { font: 15.5px 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #475569; }
    .legend { font: 15.5px 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #475569; }
  </style>

  <rect width="1080" height="840" fill="#ffffff"/>

  <!-- ======================= Row 1 ======================= -->
  <text class="title" x="20" y="32">① 初始</text>
  <g transform="translate(20,60)">
    <line class="edge" x1="60" y1="140" x2="170" y2="50"/>
    <line class="edge" x1="60" y1="140" x2="170" y2="140"/>
    <line class="edge" x1="60" y1="140" x2="110" y2="240"/>
    <line class="edge" x1="170" y1="50" x2="170" y2="140"/>
    <line class="edge" x1="170" y1="50" x2="300" y2="110"/>
    <line class="edge" x1="170" y1="140" x2="300" y2="110"/>
    <line class="edge" x1="110" y1="240" x2="300" y2="110"/>
    <text class="w" x="105" y="85">2</text>
    <text class="w" x="110" y="128">1</text>
    <text class="w" x="72" y="198">2</text>
    <text class="w" x="188" y="95">1</text>
    <text class="w" x="245" y="68">3</text>
    <text class="w" x="250" y="142">6</text>
    <text class="w" x="208" y="188">3</text>

    <circle class="node" cx="60" cy="140" r="21"/><text class="nid" x="60" y="147">1</text>
    <circle class="node" cx="170" cy="50" r="21"/><text class="nid" x="170" y="57">2</text>
    <circle class="node" cx="170" cy="140" r="21"/><text class="nid" x="170" y="147">3</text>
    <circle class="node" cx="110" cy="240" r="21"/><text class="nid" x="110" y="247">4</text>
    <circle class="node" cx="300" cy="110" r="21"/><text class="nid" x="300" y="117">5</text>

    <text class="d" x="26" y="180">d=0</text>
    <text class="d" x="210" y="32">∞</text>
    <text class="d" x="220" y="172">∞</text>
    <text class="d" x="55" y="280">∞</text>
    <text class="d" x="300" y="152">∞</text>

    <text class="cap" x="0" y="312">初始：d[1] = 0，其余 ∞</text>
    <text class="cap2" x="0" y="338">堆：{0, 1}</text>
  </g>

  <text class="title" x="380" y="32">② 弹出 1</text>
  <g transform="translate(380,60)">
    <line class="edge" x1="60" y1="140" x2="170" y2="50"/>
    <line class="edge" x1="60" y1="140" x2="170" y2="140"/>
    <line class="edge" x1="60" y1="140" x2="110" y2="240"/>
    <line class="edge" x1="170" y1="50" x2="170" y2="140"/>
    <line class="edge" x1="170" y1="50" x2="300" y2="110"/>
    <line class="edge" x1="170" y1="140" x2="300" y2="110"/>
    <line class="edge" x1="110" y1="240" x2="300" y2="110"/>
    <text class="w" x="105" y="85">2</text>
    <text class="w" x="110" y="128">1</text>
    <text class="w" x="72" y="198">2</text>
    <text class="w" x="188" y="95">1</text>
    <text class="w" x="245" y="68">3</text>
    <text class="w" x="250" y="142">6</text>
    <text class="w" x="208" y="188">3</text>

    <circle class="node now" cx="60" cy="140" r="21"/><text class="nid" x="60" y="147">1</text>
    <circle class="node" cx="170" cy="50" r="21"/><text class="nid" x="170" y="57">2</text>
    <circle class="node" cx="170" cy="140" r="21"/><text class="nid" x="170" y="147">3</text>
    <circle class="node" cx="110" cy="240" r="21"/><text class="nid" x="110" y="247">4</text>
    <circle class="node" cx="300" cy="110" r="21"/><text class="nid" x="300" y="117">5</text>

    <text class="d" x="26" y="180">d=0</text>
    <text class="d" x="212" y="32">d=2</text>
    <text class="d" x="222" y="172">d=1</text>
    <text class="d" x="55" y="280">d=2</text>
    <text class="d" x="300" y="152">∞</text>

    <text class="cap" x="0" y="312">加入点 1；更新 2、3、4</text>
    <text class="cap2" x="0" y="338">堆：{1,3} {2,2} {2,4}</text>
  </g>

  <text class="title" x="740" y="32">③ 弹出 3（d=1）</text>
  <g transform="translate(740,60)">
    <line class="edge" x1="60" y1="140" x2="170" y2="50"/>
    <line class="tree" x1="60" y1="140" x2="170" y2="140"/>
    <line class="edge" x1="60" y1="140" x2="110" y2="240"/>
    <line class="edge" x1="170" y1="50" x2="170" y2="140"/>
    <line class="edge" x1="170" y1="50" x2="300" y2="110"/>
    <line class="edge" x1="170" y1="140" x2="300" y2="110"/>
    <line class="edge" x1="110" y1="240" x2="300" y2="110"/>
    <text class="w" x="105" y="85">2</text>
    <text class="w" x="110" y="128">1</text>
    <text class="w" x="72" y="198">2</text>
    <text class="w" x="188" y="95">1</text>
    <text class="w" x="245" y="68">3</text>
    <text class="w" x="250" y="142">6</text>
    <text class="w" x="208" y="188">3</text>

    <circle class="node on" cx="60" cy="140" r="21"/><text class="nid" x="60" y="147">1</text>
    <circle class="node" cx="170" cy="50" r="21"/><text class="nid" x="170" y="57">2</text>
    <circle class="node now" cx="170" cy="140" r="21"/><text class="nid" x="170" y="147">3</text>
    <circle class="node" cx="110" cy="240" r="21"/><text class="nid" x="110" y="247">4</text>
    <circle class="node" cx="300" cy="110" r="21"/><text class="nid" x="300" y="117">5</text>

    <text class="d" x="26" y="180">d=0</text>
    <text class="d" x="212" y="32">d=1</text>
    <text class="d" x="222" y="172">d=1</text>
    <text class="d" x="55" y="280">d=2</text>
    <text class="d" x="300" y="152">d=6</text>

    <text class="cap" x="0" y="312">选边 1-3；2→1、5→6</text>
    <text class="cap2" x="0" y="338">堆：{1,2} {2,2} {2,4} {6,5}</text>
  </g>

  <!-- ======================= Row 2 ======================= -->
  <text class="title" x="20" y="425">④ 弹出 2（d=1）</text>
  <g transform="translate(20,452)">
    <line class="edge" x1="60" y1="140" x2="170" y2="50"/>
    <line class="tree" x1="60" y1="140" x2="170" y2="140"/>
    <line class="edge" x1="60" y1="140" x2="110" y2="240"/>
    <line class="tree" x1="170" y1="50" x2="170" y2="140"/>
    <line class="edge" x1="170" y1="50" x2="300" y2="110"/>
    <line class="edge" x1="170" y1="140" x2="300" y2="110"/>
    <line class="edge" x1="110" y1="240" x2="300" y2="110"/>
    <text class="w" x="105" y="85">2</text>
    <text class="w" x="110" y="128">1</text>
    <text class="w" x="72" y="198">2</text>
    <text class="w" x="188" y="95">1</text>
    <text class="w" x="245" y="68">3</text>
    <text class="w" x="250" y="142">6</text>
    <text class="w" x="208" y="188">3</text>

    <circle class="node on" cx="60" cy="140" r="21"/><text class="nid" x="60" y="147">1</text>
    <circle class="node now" cx="170" cy="50" r="21"/><text class="nid" x="170" y="57">2</text>
    <circle class="node on" cx="170" cy="140" r="21"/><text class="nid" x="170" y="147">3</text>
    <circle class="node" cx="110" cy="240" r="21"/><text class="nid" x="110" y="247">4</text>
    <circle class="node" cx="300" cy="110" r="21"/><text class="nid" x="300" y="117">5</text>

    <text class="d" x="26" y="180">d=0</text>
    <text class="d" x="212" y="32">d=1</text>
    <text class="d" x="222" y="172">d=1</text>
    <text class="d" x="55" y="280">d=2</text>
    <text class="d" x="300" y="152">d=3</text>

    <text class="cap" x="0" y="312">选边 3-2；5→3</text>
    <text class="cap2" x="0" y="338">堆：{2,2}旧 {2,4} {3,5} {6,5}</text>
  </g>

  <text class="title" x="380" y="425">⑤ 弹出 4（d=2）</text>
  <g transform="translate(380,452)">
    <line class="edge" x1="60" y1="140" x2="170" y2="50"/>
    <line class="tree" x1="60" y1="140" x2="170" y2="140"/>
    <line class="tree" x1="60" y1="140" x2="110" y2="240"/>
    <line class="tree" x1="170" y1="50" x2="170" y2="140"/>
    <line class="edge" x1="170" y1="50" x2="300" y2="110"/>
    <line class="edge" x1="170" y1="140" x2="300" y2="110"/>
    <line class="edge" x1="110" y1="240" x2="300" y2="110"/>
    <text class="w" x="105" y="85">2</text>
    <text class="w" x="110" y="128">1</text>
    <text class="w" x="72" y="198">2</text>
    <text class="w" x="188" y="95">1</text>
    <text class="w" x="245" y="68">3</text>
    <text class="w" x="250" y="142">6</text>
    <text class="w" x="208" y="188">3</text>

    <circle class="node on" cx="60" cy="140" r="21"/><text class="nid" x="60" y="147">1</text>
    <circle class="node on" cx="170" cy="50" r="21"/><text class="nid" x="170" y="57">2</text>
    <circle class="node on" cx="170" cy="140" r="21"/><text class="nid" x="170" y="147">3</text>
    <circle class="node now" cx="110" cy="240" r="21"/><text class="nid" x="110" y="247">4</text>
    <circle class="node" cx="300" cy="110" r="21"/><text class="nid" x="300" y="117">5</text>

    <text class="d" x="26" y="180">d=0</text>
    <text class="d" x="212" y="32">d=1</text>
    <text class="d" x="222" y="172">d=1</text>
    <text class="d" x="55" y="280">d=2</text>
    <text class="d" x="300" y="152">d=3</text>

    <text class="cap" x="0" y="312">选边 1-4；4-5 不更优</text>
    <text class="cap2" x="0" y="338">堆：{2,2}旧 {3,5} {6,5}</text>
  </g>

  <text class="title" x="740" y="425">⑥ 弹出 5（d=3）</text>
  <g transform="translate(740,452)">
    <line class="edge" x1="60" y1="140" x2="170" y2="50"/>
    <line class="tree" x1="60" y1="140" x2="170" y2="140"/>
    <line class="tree" x1="60" y1="140" x2="110" y2="240"/>
    <line class="tree" x1="170" y1="50" x2="170" y2="140"/>
    <line class="tree" x1="170" y1="50" x2="300" y2="110"/>
    <line class="edge" x1="170" y1="140" x2="300" y2="110"/>
    <line class="edge" x1="110" y1="240" x2="300" y2="110"/>
    <text class="w" x="105" y="85">2</text>
    <text class="w" x="110" y="128">1</text>
    <text class="w" x="72" y="198">2</text>
    <text class="w" x="188" y="95">1</text>
    <text class="w" x="245" y="68">3</text>
    <text class="w" x="250" y="142">6</text>
    <text class="w" x="208" y="188">3</text>

    <circle class="node on" cx="60" cy="140" r="21"/><text class="nid" x="60" y="147">1</text>
    <circle class="node on" cx="170" cy="50" r="21"/><text class="nid" x="170" y="57">2</text>
    <circle class="node on" cx="170" cy="140" r="21"/><text class="nid" x="170" y="147">3</text>
    <circle class="node on" cx="110" cy="240" r="21"/><text class="nid" x="110" y="247">4</text>
    <circle class="node now" cx="300" cy="110" r="21"/><text class="nid" x="300" y="117">5</text>

    <text class="d" x="26" y="180">d=0</text>
    <text class="d" x="212" y="32">d=1</text>
    <text class="d" x="222" y="172">d=1</text>
    <text class="d" x="55" y="280">d=2</text>
    <text class="d" x="300" y="152">d=3</text>

    <text class="cap" x="0" y="312">完成：1+1+2+3 = 7</text>
    <text class="cap2" x="0" y="338">旧记录 {2,2}、{6,5} 跳过</text>
  </g>

  <text class="legend" x="20" y="820">绿边 = 已选；橙圈 = 本步加入；1-2 权 2 被 3-2 权 1 取代</text>
</svg>
