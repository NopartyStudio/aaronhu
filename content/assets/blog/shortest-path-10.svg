<text x="24" y="34" font-size="21" fill="#0f172a" text-anchor="start" font-weight="700">⑩ Floyd：把“允许经过哪些中转点”当成 DP 的一层</text>
<text x="24" y="58" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400">k 从小到大放行中转点；k 必须写最外层，这是最容易写错的地方</text>
