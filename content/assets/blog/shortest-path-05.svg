  <rect width="1080" height="476" fill="#ffffff"/>
<text x="24" y="34" font-size="21" fill="#0f172a" text-anchor="start" font-weight="700">⑤ 堆优化：把“扫一遍找最小”换成“堆顶直接拿”</text>
<text x="24" y="58" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400">朴素版每轮 O(n) 找最小点；堆优化把候选点丢进小根堆，取出即最小</text>
