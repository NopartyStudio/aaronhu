<circle class="n" cx="150" cy="342" r="15"/><text x="150" y="346.68" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">3</text>
<circle class="n" cx="300" cy="184" r="15"/><text x="300" y="188.68" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">4</text>
<circle class="n" cx="350" cy="296" r="15"/><text x="350" y="300.68" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">5</text>
