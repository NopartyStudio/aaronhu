<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="508" viewBox="0 0 1020 508" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif">
  <style>
    .e{stroke:#94a3b8;stroke-width:2.4;fill:none;stroke-linecap:round}
    .e2{stroke:#cbd5e1;stroke-width:2.2;fill:none;stroke-linecap:round}
    .hl{stroke:#2563eb;stroke-width:4.4;stroke-linecap:round;fill:none}
    .bad{stroke:#dc2626;stroke-width:4.4;stroke-linecap:round;fill:none}
    .good{stroke:#16a34a;stroke-width:4.4;stroke-linecap:round;fill:none}
    .dash{stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:7 6;fill:none}
    .n{fill:#f8fafc;stroke:#64748b;stroke-width:2.4}
    .ns{fill:#dcfce7;stroke:#16a34a;stroke-width:2.8}
    .ncur{fill:#fef3c7;stroke:#f59e0b;stroke-width:3.4}
    .w{font-size:13px;font-weight:700;fill:#475569;text-anchor:middle}
</style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1020" height="508" fill="#ffffff"/>
<text x="24" y="34" font-size="21" fill="#0f172a" text-anchor="start" font-weight="700">⑥ 为什么 Dijkstra 一遇到负权边就崩</text>
<text x="24" y="58" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400">课件同款反例：1→2→4→5 只要 3，但真正的最短路只要 1</text>
<rect x="24" y="76" width="470" height="372" rx="12" fill="#fff1f2" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="42" y="104" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700">Dijkstra 的答案：3</text>
<text x="42" y="126" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">按 d 从小到大定案，d[4]=2 先被锁死</text>
<g transform="translate(34,136)">
<line class="bad" x1="70.6760455000244" y1="109.42015801537035" x2="171.3239544999756" y2="50.579841984629645"/>
<rect x="104.4" y="54.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="112" y="66" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<line class="e2" x1="70.47819138397725" y1="126.90965623629369" x2="171.52180861602275" y2="189.0903437637063"/>
<rect x="92.4" y="160.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="100" y="172" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">3</text>
<line class="bad" x1="200.6760455000244" y1="50.579841984629645" x2="301.3239544999756" y2="109.42015801537035"/>
<rect x="250.4" y="50.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="258" y="62" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<line class="e2" x1="200.47819138397725" y1="189.0903437637063" x2="301.5218086160228" y2="126.90965623629369"/>
<rect x="238.8" y="164.5" width="22.5" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="250" y="176" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">−3</text>
<line class="bad" x1="333.0" y1="118.0" x2="413.0" y2="118.0"/>
<rect x="366.4" y="90.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="374" y="102" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<circle class="n" cx="56" cy="118" r="17"/><text x="56" y="123.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">1</text>
<circle class="n" cx="186" cy="42" r="17"/><text x="186" y="47.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">2</text>
<circle class="n" cx="186" cy="198" r="17"/><text x="186" y="203.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">3</text>
<circle class="n" cx="316" cy="118" r="17"/><text x="316" y="123.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">4</text>
<circle class="n" cx="430" cy="118" r="17"/><text x="430" y="123.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">5</text>
</g>
<text x="42" y="424" font-size="12.5" fill="#334155" text-anchor="start" font-weight="700">错因：4 已经进 S，3+(-3)=0 &lt; 2 也改不回来了</text>
<rect x="526" y="76" width="470" height="372" rx="12" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="544" y="104" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700">真正的最短路：1</text>
<text x="544" y="126" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">绕远路 1→3 反而更便宜，因为 −3 太狠</text>
<g transform="translate(536,136)">
<line class="e2" x1="70.6760455000244" y1="109.42015801537035" x2="171.3239544999756" y2="50.579841984629645"/>
<rect x="104.4" y="54.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="112" y="66" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<line class="good" x1="70.47819138397725" y1="126.90965623629369" x2="171.52180861602275" y2="189.0903437637063"/>
<rect x="92.4" y="160.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="100" y="172" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">3</text>
<line class="e2" x1="200.6760455000244" y1="50.579841984629645" x2="301.3239544999756" y2="109.42015801537035"/>
<rect x="250.4" y="50.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="258" y="62" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<line class="good" x1="200.47819138397725" y1="189.0903437637063" x2="301.5218086160228" y2="126.90965623629369"/>
<rect x="238.8" y="164.5" width="22.5" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="250" y="176" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">−3</text>
<line class="good" x1="333.0" y1="118.0" x2="413.0" y2="118.0"/>
<rect x="366.4" y="90.5" width="15.2" height="16.0" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="374" y="102" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<circle class="n" cx="56" cy="118" r="17"/><text x="56" y="123.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">1</text>
<circle class="n" cx="186" cy="42" r="17"/><text x="186" y="47.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">2</text>
<circle class="n" cx="186" cy="198" r="17"/><text x="186" y="203.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">3</text>
<circle class="n" cx="316" cy="118" r="17"/><text x="316" y="123.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">4</text>
<circle class="n" cx="430" cy="118" r="17"/><text x="430" y="123.4" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">5</text>
</g>
<text x="544" y="424" font-size="12.5" fill="#334155" text-anchor="start" font-weight="700">关键：负数让“绕路”比“直达”更近，贪心失效</text>
<text x="24" y="482" font-size="13.5" fill="#b91c1c" text-anchor="start" font-weight="700">一句话：Dijkstra 相信“先定案的点不会再变”，负权边会推翻这个信念。</text>
</svg>
